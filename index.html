  const gap={slow:1700,mid:1300,fast:1000}[settings.speed]||1700;
  shell(`📦 Phonics Conveyor Belt${voice?' 🎤':''}`,voice?'Phân loại bằng giọng nói':'Băng chuyền phân loại',
    voice?'Mỗi đội 20 giây. NÓI TO từ trên kiện hàng vào micro; hệ thống tự phân loại kiện đó vào đúng thùng chữ cái (+40, có combo).':'Mỗi đội có 20 giây. Kéo mỗi kiện hàng vào đúng thùng chữ cái theo âm đầu của từ trước khi nó trôi khỏi băng chuyền. Đúng +40, phân loại đúng liên tiếp được thưởng combo. Sai thùng −20.',
  `<div class="belt-top"><span class="pill" id="cwho"></span><span class="pill">⏱ <b id="ct">${DUR}</b> giây</span><span class="pill">Điểm lượt này: <b id="cs">0</b></span><span class="combo" id="ccombo" style="font-size:1.2rem"></span></div>
   ${voice?micHTML():''}
   <div class="belt-scene" id="scene"><div class="belt-line"></div></div>
   <div class="bins" id="bins">${ls.map(l=>`<div class="bin" data-lid="${l.id}" style="${lsty(l)}">${esc(l.letter)}<small>${esc(l.sound)}</small></div>`).join('')}</div>`);
  const scene=$('#scene'),bins=$$('.bin');let left,tscore,streak,running=false,spawnT,alive=[];
  function prep(){
    if(t>=teams.length*ROUNDS){results('Băng chuyền dừng lại!',()=>go('conveyor'));return}
    $('#cwho').innerHTML=`Lượt: ${teamLabel(t%teams.length)}`;$('#ct').textContent=DUR;$('#cs').textContent=0;$('#ccombo').textContent='';
    turnCard(t%teams.length,`${voice?'NÓI TO từ trên kiện hàng để phân loại':'Kéo kiện hàng vào đúng thùng chữ cái'} trong ${DUR} giây. Đúng liên tiếp được cộng combo!`,start);
  }
  function listenBelt(){beginListening(alts=>{if(!running)return;
    for(const rec of alive){if(rec.done)continue;if(saidWord(alts,rec.w.w)){const bin=bins.find(b=>b.dataset.lid===rec.w.lid);if(bin){drop(rec,bin);break}}}});}
  function start(){
    running=true;left=DUR;tscore=0;streak=0;alive=[];
    spawnT=every(spawn,gap);
    const k=every(()=>{left--;$('#ct').textContent=left;if(left<=5&&left>0)sfx.tick();if(left<=0){clearInterval(spawnT);clearInterval(k);end()}},1000);
    later(spawn,300);if(voice)listenBelt();
  }
  function spawn(){
    if(!running)return;const w=pick(pool());
    const el=document.createElement('button');el.className='parcel';el.setAttribute('aria-label',w.w);
    el.innerHTML=`<span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span>`;
    scene.appendChild(el);el.style.left='-110px';
    const dur=sp;const startT=performance.now();const rec={el,w,done:false};alive.push(rec);
    const width=scene.clientWidth;
    function step(now){if(rec.done||!running){return}const p=(now-startT)/dur;if(p>=1){rec.done=true;el.remove();alive=alive.filter(x=>x!==rec);say(w.w,1.05);return}el.style.left=(-110+p*(width+140))+'px';requestAnimationFrame(step)}
    requestAnimationFrame(step);
    draggable(el,{onDrop:(x,y)=>{
      const bin=bins.find(b=>inRect(b,x,y,20));bins.forEach(b=>b.classList.remove('over'));
      if(bin&&!rec.done){drop(rec,bin)}else{el.style.position='';el.style.left=(parseFloat(el.style.left)||0)+'px'}
    },onMove:(x,y)=>bins.forEach(b=>b.classList.toggle('over',inRect(b,x,y,20)))});
  }
  function drop(rec,bin){
    rec.done=true;const good=bin.dataset.lid===rec.w.lid;
    bin.classList.remove(good?'miss':'hit');void bin.offsetWidth;bin.classList.add(good?'hit':'miss');
    if(good){streak++;const pts=40+(streak>=5?20:0);sfx.good();say(rec.w.w,1.05);tscore+=pts;addScore(t%teams.length,pts);$('#ccombo').textContent=streak>=3?`🔥 Combo x${streak}`:''}
    else{streak=0;sfx.bad();tscore-=20;addScore(t%teams.length,-20);$('#ccombo').textContent=''}
    $('#cs').textContent=tscore;rec.el.classList.add('gone');later(()=>{rec.el.remove();alive=alive.filter(x=>x!==rec)},50);
  }
  function end(){running=false;stopRecog();$$('.parcel',scene).forEach(p=>p.remove());alive=[];sfx.win();
    later(()=>overlay(`<div class="ov-emoji">📦</div><h2>Hết giờ!</h2><p>${teamLabel(t%teams.length)} được ${tscore} điểm ở lượt này.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),500);}
  if(voice)wireMic(()=>{if(running)listenBelt()});
  prep();
};

/* ============ 13. PHONICS MEMORY MATRIX ============ */
screens.matrix=()=>{
  if(!need(1))return;const voice=voiceMode;
  const SHOW=5,GUESS=20;let t=0;
  shell(`🧠 Phonics Memory Matrix${voice?' 🎤':''}`,voice?'Lưới nhớ — nói bằng giọng nói':'Lưới nhớ vị trí',
    voice?`Xem 9 hình trong ${SHOW} giây rồi các ô úp lại. Đội NÓI TO các từ có âm mục tiêu mà mình nhớ được vào micro; nói đúng từ nào thì ô đó tự mở. Nói sai không bị phạt.`:`Các ô đều có số để cả lớp dễ gọi tên ("mở ô số 5"). Xem 9 hình trong ${SHOW} giây rồi các ô úp lại. Máy đọc âm cần tìm, đội có ${GUESS} giây nhớ và mở đúng tất cả các ô có âm đó. Mở đúng hết được thưởng lớn, mở sai một ô là kết thúc lượt.`,
  `<div class="mm-top"><span class="pill" id="mmwho"></span><div class="target" id="mmtarget"></div><span class="pill" id="mmtimer"></span></div>
   ${voice?micHTML():''}
   <p class="status" id="mmst"></p><div class="mm-grid" id="grid"></div>`);
  const grid=$('#grid');let target,cells,targets,openable=false,found,tid;
  function openCorrect(i){const c=grid.children[i];if(!c||!openable||!c.classList.contains('down')||c.classList.contains('got'))return;
    c.classList.remove('down');c.classList.add('got');sfx.good();say(cells[i].w,1.05);found++;addScore(t%teams.length,60);if(found>=targets.length)winRound()}
  function listenMatrix(){beginListening(alts=>{if(!openable)return;
    for(let i=0;i<cells.length;i++){const c=grid.children[i];if(!c||!c.classList.contains('down')||c.classList.contains('got'))continue;if(cells[i].lid===target.id&&saidWord(alts,cells[i].w)){openCorrect(i);break}}});}
  function prep(){
    if(t>=teams.length*ROUNDS){results('Trò chơi trí nhớ kết thúc!',()=>go('matrix'));return}
    const ls=activeLessons();target=ls[t%ls.length];
    const tw=target.words.map(w=>({...w,lid:target.id}));
    const others=shuffle(pool().filter(w=>w.lid!==target.id));
    const nT=Math.min(Math.max(2,tw.length),4,9);
    let chosen=shuffle(tw).slice(0,nT);
    chosen=[...chosen,...others.slice(0,9-chosen.length)];
    cells=shuffle(chosen);targets=cells.map((w,i)=>w.lid===target.id?i:-1).filter(i=>i>=0);found=0;openable=false;
    grid.innerHTML=cells.map((w,i)=>`<button class="mm-cell" data-i="${i}"><span class="inner"><span class="mm-face mm-front"><span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span></span><span class="mm-face mm-back"><b class="mmnum">${i+1}</b></span></span></button>`).join('');
    $('#mmwho').innerHTML=`Lượt: ${teamLabel(t%teams.length)}`;
    $('#mmtarget').innerHTML=`Nhớ vị trí âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>`;
    turnCard(t%teams.length,`Sắp xem 9 hình trong ${SHOW} giây. Hãy nhớ vị trí các hình có âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span> nhé!`,show);
  }
  function show(){
    $('#mmst').textContent='Ghi nhớ nhanh nào!';let s=SHOW;$('#mmtimer').textContent=`👀 ${s} giây`;
    const iv=every(()=>{s--;$('#mmtimer').textContent=`👀 ${s} giây`;if(s<=0){clearInterval(iv);hide()}},1000);
  }
  function hide(){
    $$('.mm-cell',grid).forEach(c=>c.classList.add('down'));say(`Find the ${target.letter[0]} pictures!`);
    $('#mmst').innerHTML=`Mở tất cả các ô âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>!`;
    openable=true;let s=GUESS;$('#mmtimer').textContent=`⏱ ${s} giây`;
    tid=every(()=>{s--;$('#mmtimer').textContent=`⏱ ${s} giây`;if(s<=3&&s>0)sfx.tick();if(s<=0){clearInterval(tid);timeUp()}},1000);
    if(voice)listenMatrix();
  }
  grid.onclick=e=>{const c=e.target.closest('.mm-cell');if(!c||!openable||!c.classList.contains('down')||c.classList.contains('got'))return;
    const i=+c.dataset.i;
    if(voice){if(cells[i].lid===target.id)openCorrect(i);return}
    c.classList.remove('down');
    if(cells[i].lid===target.id){c.classList.add('got');sfx.good();say(cells[i].w,1.05);found++;addScore(t%teams.length,60);if(found>=targets.length)winRound()}
    else{c.classList.add('no');sfx.bad();say(cells[i].w,1.05);openable=false;clearInterval(tid);later(loseRound,900)}
  };
  if(voice)wireMic(()=>{if(openable)listenMatrix()});
  function winRound(){openable=false;clearInterval(tid);stopRecog();const bonus=100;addScore(t%teams.length,bonus);sfx.win();$('#mmst').textContent='Chính xác hết! 🎉';
    later(()=>overlay(`<div class="ov-emoji">🧠</div><h2>Trí nhớ siêu đỉnh!</h2><p>${teamLabel(t%teams.length)} mở đúng hết và được thưởng ${bonus} điểm.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),700);}
  function reveal(){$$('.mm-cell',grid).forEach((c,i)=>{c.classList.remove('down');if(cells[i].lid===target.id&&!c.classList.contains('got'))c.classList.add('reveal')})}
  function loseRound(){reveal();$('#mmst').textContent='Ôi! Sai một ô rồi. Các ô viền vàng là đáp án.';
    later(()=>overlay(`<div class="ov-emoji">🙈</div><h2>Hết lượt!</h2><p>${teamLabel(t%teams.length)} mở đúng ${found} ô trước khi sai.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),1800);}
  function timeUp(){openable=false;stopRecog();reveal();$('#mmst').textContent='Hết giờ! Các ô viền vàng là đáp án còn lại.';
    later(()=>overlay(`<div class="ov-emoji">⏰</div><h2>Hết giờ!</h2><p>${teamLabel(t%teams.length)} mở đúng ${found}/${targets.length} ô.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),1800);}
  prep();
};

/* ============ 14. SOUND SPACE INVADERS ============ */
screens.space=()=>{
  if(!need(2))return;const voice=voiceMode;
  const HP=5,WAVE=10;let t=0;
  const fall={slow:15000,mid:11000,fast:8000}[settings.speed]||15000;
  const gap={slow:2600,mid:2000,fast:1500}[settings.speed]||2600;
  shell(`🚀 Sound Space Invaders${voice?' 🎤':''}`,voice?'Bắn phá âm bằng giọng nói':'Phi thuyền bắn phá âm',
    voice?`Radar báo âm mục tiêu. NÓI TO từ trên thiên thạch có âm mục tiêu vào micro để bắn hạ nó (+100). Để thiên thạch mục tiêu rơi xuống thì mất 1 ❤️.`:`Radar báo âm mục tiêu. Di chuyển phi thuyền (◀ ▶ hoặc phím mũi tên) và bắn (🔴 hoặc phím cách) vào thiên thạch mang hình có âm đó. Bắn trúng +100. Bắn nhầm âm khác hoặc để thiên thạch mục tiêu rơi xuống thì mất 1 ❤️.`,
  `<div class="space-stage" id="stage"><div class="radar"><span class="pill" id="swho"></span><span class="pill" id="starget"></span><span class="pill" id="shp"></span><span class="pill" id="sleft"></span></div>
     <div class="ship" id="ship">🚀</div>
     ${voice?'':'<div class="space-ctrl"><button id="leftBtn" aria-label="Sang trái">◀</button><button class="fire" id="fireBtn" aria-label="Bắn">🔴 BẮN</button><button id="rightBtn" aria-label="Sang phải">▶</button></div>'}</div>
   ${voice?micHTML():''}`);
  const stage=$('#stage'),ship=$('#ship');
  function listenSpace(){beginListening(alts=>{if(!running)return;
    const m=creeps.find(m=>m.w.lid===target.id&&saidWord(alts,m.w.w));if(m){const sr=stage.getBoundingClientRect(),r=m.el.getBoundingClientRect();shipX=r.left-sr.left+r.width/2;ship.style.left=shipX+'px';hitMeteor(m)}});}
  for(let i=0;i<40;i++){const s=document.createElement('span');s.className='star';s.style.left=rand(0,100)+'%';s.style.top=rand(0,100)+'%';s.style.opacity=rand(.3,1);stage.appendChild(s)}
  let target,hp,spawned,shipX,creeps=[],bullets=[],running=false,last=0,lastSpawn=0,moveDir=0;
  const hud=()=>{$('#swho').innerHTML=`Bắn: ${teamLabel(t%teams.length)}`;$('#starget').innerHTML=`Mục tiêu: <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>`;$('#shp').textContent='❤️'.repeat(Math.max(0,hp))+'🤍'.repeat(HP-Math.max(0,hp));$('#sleft').textContent=`Thiên thạch: ${spawned}/${WAVE}`};
  function prep(){if(t>=teams.length*ROUNDS){results('Vũ trụ đã an toàn!',()=>go('space'));return}
    const ls=activeLessons();target=ls[t%ls.length];hp=HP;spawned=0;shipX=stage.clientWidth/2;ship.style.left=shipX+'px';hud();
    turnCard(t%teams.length,`${voice?'NÓI TO từ trên thiên thạch':'Bắn các thiên thạch mang hình'} có âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>. Thành có ${HP} ❤️.`,start);}
  function start(){running=true;last=performance.now();lastSpawn=-1e9;frame(loop);if(voice)listenSpace()}
  function spawnMeteor(){
    const isT=Math.random()<.5;const w=isT?pick(target.words.map(x=>({...x,lid:target.id}))):pick(pool().filter(x=>x.lid!==target.id));
    const el=document.createElement('div');el.className='meteor';el.innerHTML=`<span class="emo">☄️</span><span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span>`;
    stage.appendChild(el);const x=rand(10,Math.max(12,stage.clientWidth-100));const m={el,w,x,y:60};el.style.left=x+'px';el.style.top='60px';creeps.push(m);spawned++;hud();say(w.w);
  }
  function fire(){
    if(!running)return;const b=document.createElement('div');b.className='laser';
    const bx=shipX,by=stage.clientHeight-84;b.style.left=(bx-4)+'px';b.style.top=by+'px';b.style.height='22px';stage.appendChild(b);bullets.push({el:b,x:bx,y:by});sfx.buzz&&tone(880,.12,'square',0,.08,1200);
  }
  function loop(now){const dt=Math.min(64,now-last);last=now;
    if(running){
      if(moveDir){shipX=Math.max(40,Math.min(stage.clientWidth-40,shipX+moveDir*dt*.5));ship.style.left=shipX+'px'}
      const floor=stage.clientHeight-70;
      creeps.forEach(m=>{m.y+=dt*(floor/fall);m.el.style.top=m.y+'px';});
      [...creeps].forEach(m=>{if(m.y>=floor){creeps=creeps.filter(x=>x!==m);m.el.remove();if(m.w.lid===target.id){damage();toast(`Để lọt "${m.w.w}" (âm ${target.sound})!`)}}});
      bullets.forEach(bl=>{bl.y-=dt*.9;bl.el.style.top=bl.y+'px'});
      [...bullets].forEach(bl=>{if(bl.y<40){bl.el.remove();bullets=bullets.filter(x=>x!==bl);return}
        const hitM=creeps.find(m=>{const r=m.el.getBoundingClientRect(),sr=stage.getBoundingClientRect();const mx=r.left-sr.left+r.width/2,my=r.top-sr.top+r.height/2;return Math.abs(mx-bl.x)<54&&Math.abs(my-bl.y)<50});
        if(hitM){bl.el.remove();bullets=bullets.filter(x=>x!==bl);hitMeteor(hitM)}});
      if(spawned<WAVE&&creeps.length<2&&now-lastSpawn>gap){spawnMeteor();lastSpawn=now}
      if(spawned>=WAVE&&!creeps.length)endWave();
    }
    frame(loop);
  }
  function hitMeteor(m){creeps=creeps.filter(x=>x!==m);
    if(m.w.lid===target.id){const L=target.letter[0].toUpperCase();say(`${L}. ${m.w.w}!`,1);sfx.good();addScore(t%teams.length,100);m.el.classList.add('boom');m.el.textContent='💥';later(()=>m.el.remove(),500)}
    else{sfx.bad();m.el.classList.add('boom');m.el.textContent='🛡️';later(()=>m.el.remove(),500);toast(`"${m.w.w}" không phải âm ${target.sound}!`);damage()}
  }
  function damage(){hp--;hud();if(hp<=0)endWave()}
  function endWave(){if(!running)return;running=false;stopRecog();creeps.forEach(m=>m.el.remove());creeps=[];bullets.forEach(b=>b.el.remove());bullets=[];
    const ok=hp>0,bonus=Math.max(0,hp)*40;if(bonus)addScore(t%teams.length,bonus);
    later(()=>overlay(`<div class="ov-emoji">${ok?'🚀':'💥'}</div><h2>${ok?'Nhiệm vụ hoàn thành!':'Phi thuyền hết khiên!'}</h2><p>${teamLabel(t%teams.length)} ${ok?`còn ${hp} ❤️, thưởng thêm ${bonus} điểm.`:'cố gắng hơn lần sau nhé.'}</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),500);}
  const press=d=>{moveDir=d};const release=()=>{moveDir=0};
  if(!voice){
    $('#leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();press(-1)});
    $('#rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();press(1)});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>{$('#leftBtn').addEventListener(ev,release);$('#rightBtn').addEventListener(ev,release)});
    $('#fireBtn').addEventListener('pointerdown',e=>{e.preventDefault();fire()});
    onKey(e=>{if(e.key==='ArrowLeft'){e.preventDefault();press(-1)}else if(e.key==='ArrowRight'){e.preventDefault();press(1)}else if(e.code==='Space'){e.preventDefault();fire()}});
    const ku=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')release()};document.addEventListener('keyup',ku);cleanups.push(()=>document.removeEventListener('keyup',ku));
  } else wireMic(()=>{if(running)listenSpace()});
  prep();
};

/* ============ NÓI THEO HÌNH (Speaking Sprint) ============ */
screens.speak=()=>{
  if(!need(1))return;
  const DUR=20;let t=0;
  shell('🎤 Nói Theo Hình','Speaking Sprint — nói vào micro','Mỗi đội 20 giây. Nhìn hình rồi NÓI TO từ tiếng Anh vào micro. Nói đúng được +50 và tự chuyển sang hình mới. Nói được càng nhiều từ càng tốt! (Cần Chrome và cho phép micro.)',
  `<div class="whack-top"><span class="pill" id="spwho"></span><span class="pill">⏱ <b id="spt">${DUR}</b> giây</span><span class="pill">Nói đúng: <b id="spc">0</b></span></div>
   <div class="speak-card"><span class="emo" id="spemo">❓</span><span class="fw" id="spword"></span></div>
   ${micHTML()}
   <p class="status" id="spst"></p>
   <div class="row"><button class="btn small" id="spok">✓ Tính đúng</button><button class="btn ghost small" id="spskip">Bỏ qua từ này</button></div>`);
  const words=pool(),status=t=>$('#spst').innerHTML=t;
  let cur=null,left,correctN,running=false,tid;
  const listenNow=()=>beginListening(alts=>{if(running&&cur&&saidWord(alts,cur.w))hit()});
  function prep(){
    if(t>=teams.length*ROUNDS){results('Hết giờ nói!',()=>go('speak'));return}
    $('#spwho').innerHTML=`Lượt: ${teamLabel(t%teams.length)}`;$('#spt').textContent=DUR;$('#spc').textContent=0;$('#spemo').textContent='❓';$('#spword').textContent='';
    turnCard(t%teams.length,`Nhìn hình và nói to từ tiếng Anh vào micro trong ${DUR} giây!`,start);
  }
  function nextWord(){cur=pick(words);$('#spemo').textContent=cur.e;$('#spword').textContent=cur.w;showHeard([])}
  function start(){
    running=true;left=DUR;correctN=0;nextWord();status('Nói to từ tiếng Anh của hình vào micro!');listenNow();
    tid=every(()=>{if(!running)return;left--;$('#spt').textContent=left;if(left<=5&&left>0)sfx.tick();if(left<=0)end()},1000);
  }
  function hit(){if(!running)return;sfx.good();say(cur.w);correctN++;$('#spc').textContent=correctN;addScore(t%teams.length,50);nextWord()}
  $('#spok').onclick=hit;
  $('#spskip').onclick=()=>{if(running)nextWord()};
  wireMic(()=>{if(running)listenNow()});
  function end(){running=false;clearInterval(tid);stopRecog();sfx.win();
    later(()=>overlay(`<div class="ov-emoji">🎤</div><h2>Hết giờ!</h2><p>${teamLabel(t%teams.length)} nói đúng ${correctN} từ, được ${correctN*50} điểm.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),400);}
  prep();
};

/* ============ GIÁO VIÊN ============ */
screens.teacher=()=>{
  shell('⚙️ Giáo viên','Cài đặt lớp học','Chia đội, chỉnh tốc độ trò chơi và thêm từ mới. Mọi thay đổi được lưu tự động trên trình duyệt này.',
  `<section class="panel"><h3>Đội chơi</h3>
     <div class="row"><span>Số đội:</span>${[2,3,4].map(n=>`<button class="btn small ${teams.length===n?'on':'ghost'}" data-teams="${n}">${n} đội</button>`).join('')}</div>
     <div class="names">${teams.map((t,i)=>`<label class="field">${TEAM_ICONS[i]} Tên đội ${i+1} (phím ${TEAM_KEYS[i]})<input data-name="${i}" value="${esc(t.name)}" maxlength="18"></label>`).join('')}</div>
</section>
   <section class="panel"><h3>Tốc độ</h3><p>Áp dụng cho Hungry Monster và Whack-A-Sound. Lớp nhỏ tuổi nên để chậm.</p>
     <div class="row">${[['slow','Chậm'],['mid','Vừa'],['fast','Nhanh']].map(([k,v])=>`<button class="btn small ${settings.speed===k?'on':'ghost'}" data-speed="${k}">${v}</button>`).join('')}</div></section>
   <section class="panel"><h3>Giọng đọc</h3><p>Chọn giọng tiếng Anh nghe rõ nhất trên máy này rồi bấm Nghe thử. Giọng có chữ "Natural", "Online" hoặc "Google" thường tự nhiên nhất. Giọng có dấu ⭐ là giọng được gợi ý.</p>
     <div class="row"><label class="field" style="flex:1;min-width:220px">Giọng<select id="voiceSel"></select></label>
     <label class="field">Tốc độ đọc: <span id="rateLbl"></span><input type="range" id="rateIn" min="0.6" max="1.1" step="0.05" value="${settings.rate}"></label>
     <button class="btn" id="testVoice">🔊 Nghe thử</button></div>
     <p style="margin-top:10px">Nếu danh sách trống hoặc giọng vẫn khó nghe: trên Windows vào Settings → Time &amp; Language → Speech → Add voices, cài "English (United States)"; trên iPad/iPhone vào Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → English, tải giọng "Enhanced". Mở web bằng Chrome hoặc Edge sẽ có thêm giọng Google/Microsoft Natural.</p></section>
   <section class="panel"><h3>Bật/tắt bài theo buổi</h3>
     <p>Dạy tới buổi nào thì bật buổi đó. Chỉ những buổi đang <b>BẬT</b> mới hiện ở trang chủ, thẻ từ vựng và trò chơi. Mẹo: bấm "Tắt tất cả" rồi bật dần theo tiến độ.</p>
     <div class="row" style="margin-bottom:6px"><button class="btn small" id="enAll">Bật tất cả</button><button class="btn ghost small" id="enNone">Tắt tất cả</button><span id="enInfo" style="font-weight:700;color:var(--muted)"></span></div>
     ${STAGES.map((st,si)=>{const items=lessons.filter(l=>l.stage===si+1);if(!items.length)return '';
       return `<div class="stage-head"><h3 style="font-size:1rem">${esc(st)}</h3><button class="btn ghost small" data-enstage="${si+1}">Bật/Tắt giai đoạn</button></div>
       <div class="tgrid">${items.map(l=>`<button class="tchip ${l.enabled!==false?'on':''}" data-toggle="${l.id}" style="${lsty(l)}" aria-pressed="${l.enabled!==false}"><span class="tc-b">Buổi ${l.n}</span><span class="tc-l">${esc(l.letter)}</span><span class="tc-s">${l.enabled!==false?'BẬT':'tắt'}</span></button>`).join('')}</div>`}).join('')}
   </section>
   <section class="panel"><h3>Bài học và từ vựng</h3>
     ${lessons.map(l=>`<div class="lesson-ed ${l.enabled!==false?'':'dim'}" style="${lsty(l)}"><div class="le-head"><span class="lchip">${esc(l.letter)} ${esc(l.sound)}</span><b>${l.n?`Buổi ${l.n}: `:""}${esc(l.name)}</b>${l.enabled!==false?'':'<span class="off-tag">Đang tắt</span>'}<span class="sp"></span><button class="btn ghost small" data-dellesson="${l.id}">Xóa bài</button></div>
       <ul class="wlist">${l.words.map((w,i)=>`<li><span class="emo">${w.e}</span><span class="grow"><b>${esc(w.w)}</b> <small>${esc(w.ipa)}</small><br><small>${esc(w.vi)}</small></span><button class="x" data-delword="${l.id}|${i}" aria-label="Xóa từ ${esc(w.w)}">✕</button></li>`).join('')||'<li>Bài này chưa có từ nào.</li>'}</ul></div>`).join('')}
     <form class="addform" id="addWord"><h4>Thêm từ mới</h4>
       <label class="field">Bài<select name="lid">${lessons.map(l=>`<option value="${l.id}">${l.n?`Buổi ${l.n}: `:""}${esc(l.letter)} — ${esc(l.name)}</option>`).join('')}</select></label>
       <label class="field">Từ tiếng Anh<input name="w" required placeholder="egg" maxlength="20"></label>
       <label class="field">Hình (emoji)<input name="e" id="emoIn" placeholder="🥚" maxlength="10"></label>
       <label class="field">Phiên âm<input name="ipa" placeholder="/eɡ/"></label>
       <label class="field">Nghĩa tiếng Việt<input name="vi" placeholder="Quả trứng"></label>
       <div class="palette" aria-label="Chọn nhanh hình">${PALETTE.map(p=>`<button type="button" data-emo="${p}">${p}</button>`).join('')}</div>
       <button class="btn" type="submit">Thêm từ</button></form>
     <form class="addform" id="addLesson"><h4>Thêm bài mới</h4>
       <label class="field">Tên bài<input name="name" required placeholder="Buổi ${lessons.length+1}"></label>
       <label class="field">Chữ cái<input name="letter" required placeholder="Ee" maxlength="4"></label>
       <label class="field">Âm<input name="sound" required placeholder="/e/" maxlength="10"></label>
       <button class="btn" type="submit">Thêm bài</button></form>
     <p style="margin-top:14px"><button class="btn ghost small" id="restore">Khôi phục 48 bài mặc định</button></p></section>`);
  const enInfo=()=>{const on=lessons.filter(l=>l.enabled!==false).length;const el=$('#enInfo');if(el)el.textContent=`Đang bật ${on}/${lessons.length} buổi.`};enInfo();
  const setEnabled=(l,on)=>{l.enabled=on;if(on){if(!selected.includes(l.id))selected.push(l.id)}else{selected=selected.filter(x=>x!==l.id)}};
  $$('[data-toggle]').forEach(b=>b.onclick=()=>{const l=lessons.find(x=>x.id===b.dataset.toggle);setEnabled(l,l.enabled===false);saveLessons();sfx.pop();go('teacher')});
  $$('[data-enstage]').forEach(b=>b.onclick=()=>{const st=+b.dataset.enstage;const items=lessons.filter(l=>l.stage===st);const allOn=items.every(l=>l.enabled!==false);items.forEach(l=>setEnabled(l,!allOn));saveLessons();go('teacher')});
  $('#enAll').onclick=()=>{lessons.forEach(l=>setEnabled(l,true));saveLessons();go('teacher')};
  $('#enNone').onclick=()=>{lessons.forEach(l=>setEnabled(l,false));saveLessons();go('teacher')};
  $$('[data-teams]').forEach(b=>b.onclick=()=>{const n=+b.dataset.teams;while(teams.length<n)teams.push({name:TEAM_NAMES[teams.length],score:0});teams=teams.slice(0,n);saveTeams();renderScores();go('teacher')});
  $$('[data-name]').forEach(inp=>inp.oninput=()=>{teams[+inp.dataset.name].name=inp.value.trim()||TEAM_NAMES[+inp.dataset.name];saveTeams();renderScores()});
  const vs=$('#voiceSel');fillVoiceSelect(vs);
  const rl=()=>$('#rateLbl').textContent=settings.rate<.75?'chậm':settings.rate<.95?'vừa':'nhanh';rl();
  vs.onchange=()=>{voice=voices.find(v=>v.name===vs.value)||voice;settings.voice=voice?voice.name:'';store.set('pp_settings',settings);say('Hello! apple, ball, cat, dog.')};
  $('#rateIn').oninput=e=>{settings.rate=+e.target.value;store.set('pp_settings',settings);rl()};
  $('#testVoice').onclick=()=>say('Hello class! apple, ball, cat, dog.');
  $$('[data-speed]').forEach(b=>b.onclick=()=>{settings.speed=b.dataset.speed;store.set('pp_settings',settings);go('teacher')});
  $$('[data-dellesson]').forEach(b=>b.onclick=()=>{const l=lessons.find(x=>x.id===b.dataset.dellesson);if(confirm(`Xóa ${l.name} (${l.letter}) và toàn bộ từ trong bài?`)){lessons=lessons.filter(x=>x!==l);selected=selected.filter(x=>x!==l.id);saveLessons();go('teacher')}});
  $$('[data-delword]').forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.delword.split('|');const l=lessons.find(x=>x.id===id);l.words.splice(+i,1);saveLessons();go('teacher')});
  $$('[data-emo]').forEach(b=>b.onclick=()=>{$('#emoIn').value=b.dataset.emo});
  $('#addWord').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const l=lessons.find(x=>x.id===f.get('lid'));const w=f.get('w').trim().toLowerCase();if(!w)return;
    l.words.push({w,e:f.get('e').trim()||'🖼️',ipa:f.get('ipa').trim(),vi:f.get('vi').trim()});saveLessons();toast(`Đã thêm "${w}" vào ${l.name}.`);say(w);go('teacher')};
  $('#addLesson').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const id='l'+Date.now().toString(36);
    const maxN=lessons.reduce((m,l)=>Math.max(m,l.n||0),0);lessons.push({id,n:maxN+1,stage:4,enabled:true,name:f.get('name').trim(),letter:f.get('letter').trim(),sound:f.get('sound').trim(),color:COLORS[lessons.length%COLORS.length],words:[]});selected.push(id);saveLessons();toast('Đã thêm bài mới. Hãy thêm từ cho bài này.');go('teacher')};
  $('#restore').onclick=()=>{if(confirm('Khôi phục toàn bộ 48 bài mặc định? Các bài và từ đã thêm sẽ bị xóa.')){lessons=clone(DEFAULT_LESSONS);selected=['l1','l2','l3','l4'];store.set('pp_ver',DATA_VERSION);saveLessons();go('teacher')}};
};

/* ============ KHỞI ĐỘNG ============ */
$('#homeBtn').onclick=()=>go('home');
$('#teacherBtn').onclick=()=>go('teacher');
const fsBtn=$('#fsBtn');
if(!document.documentElement.requestFullscreen)fsBtn.hidden=true;
fsBtn.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})};
renderScores();
go('home');
</script>
</body>
</html>
