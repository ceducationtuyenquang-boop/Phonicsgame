<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phonics Playground – Ôn âm và từ vựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#CDEEFF; --bg2:#E8F7FF; --paper:#FFFFFF; --ink:#23264A; --muted:#565C8A; --line:#23264A;
  --sun:#FFD23F; --grass:#8BD46A; --dot:rgba(35,38,74,.07);
  --ui:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  --kid:'Andika','Baloo 2','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#18214A; --bg2:#212D62; --paper:#2B3874; --ink:#F4F6FF; --muted:#BEC6F2; --line:#0B1030; --grass:#5FA84A; --dot:rgba(255,255,255,.05); }
}
:root[data-theme="dark"]{ --bg:#18214A; --bg2:#212D62; --paper:#2B3874; --ink:#F4F6FF; --muted:#BEC6F2; --line:#0B1030; --grass:#5FA84A; --dot:rgba(255,255,255,.05); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:30px 30px;color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #3A86FF;outline-offset:3px}
h1,h2,h3,h4{line-height:1.1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.5em 1.1em;font-weight:800;font-size:1.05rem;background:var(--sun);color:#23264A;border:3px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{font-size:.95rem;padding:.35em .9em}
.btn.on{background:var(--sun);color:#23264A}
.btn.danger{background:#FF9C9C;color:#23264A}

/* header */
.top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px clamp(10px,2vw,24px);background:var(--bg2);border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:800;font-size:1.25rem}
.brand-logo{width:40px;height:40px;border-radius:9px;border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.brand-txt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.brand-txt b{font-size:1.12rem}
.brand-txt small{font-size:.72rem;color:#1E7CE8;font-weight:800;letter-spacing:.02em}
.about{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#1E7CE8,#33B0FF);color:#fff;border:4px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--line);padding:18px 22px;margin:8px 0 6px}
.about img{width:96px;height:96px;border-radius:18px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);flex:0 0 auto}
.about .a-body{flex:1;min-width:220px}
.about h2{margin:0 0 4px;font-size:clamp(1.4rem,3.4vw,2rem)}
.about .slogan{margin:0 0 8px;font-weight:700;font-size:clamp(1rem,2.3vw,1.2rem);opacity:.97}
.about .a-contact{display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:700;font-size:.98rem}
.about .a-contact span{display:inline-flex;align-items:center;gap:6px}
.about a{color:#fff;text-decoration:underline}
.about-foot{margin:34px 0 0;text-align:center;color:var(--muted);font-weight:700;line-height:1.5}
.about-foot img{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);vertical-align:middle;margin-bottom:6px}
.ov-logo{width:64px;height:64px;border-radius:14px;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);margin:0 auto 6px;display:block}
.ov-brand{font-size:.78rem;font-weight:800;letter-spacing:.03em;color:#1E7CE8;margin:-2px 0 6px}
.brand .mini{display:flex;gap:3px}
.brand .mini i{font-style:normal;font-family:var(--kid);width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--line);border-radius:7px;font-size:.95rem;color:#fff}
#scoreboard{display:flex;flex-wrap:wrap;gap:8px;flex:1;justify-content:center}
.team{display:flex;align-items:center;gap:6px;padding:3px 5px 3px 10px;background:var(--paper);border:3px solid var(--line);border-radius:999px;box-shadow:inset 0 -5px 0 var(--tc)}
.team.turn{outline:4px solid var(--tc);outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
.t-name{font-weight:800;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-score{min-width:2.6em;text-align:center;font-size:1.35rem;font-weight:800}
.t-score.bump{animation:bump .5s}
.t-adj{display:flex;gap:3px}
.t-adj button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--bg2);font-weight:800;line-height:1}
.top-tools{display:flex;gap:8px}
@keyframes pulse{50%{outline-offset:6px}}
@keyframes bump{40%{transform:scale(1.5)}}

main{max-width:1220px;margin:0 auto;padding:16px clamp(10px,2.5vw,28px) 48px}

/* home */
.hero{padding:10px 0 6px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.lead{margin:0 0 16px;color:var(--muted);max-width:62ch;font-size:1.1rem}
.blocks{display:flex;flex-wrap:wrap;gap:14px}
.block{position:relative;width:clamp(92px,12vw,130px);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lc);color:var(--lf);border:4px solid var(--line);border-radius:20px;box-shadow:0 7px 0 var(--line);font-family:var(--kid);font-weight:700;font-size:clamp(2.2rem,5vw,3.3rem);line-height:1;padding:0;overflow:hidden;transition:transform .12s,filter .2s}
.block:hover{transform:translateY(-3px) rotate(-2deg)}
.block small{font-size:1rem;margin-top:4px}
.block .b-tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--ui);font-size:.8rem;font-weight:800;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:0 8px}
.block.off{filter:grayscale(1) opacity(.4)}
.block.off::after{content:'';position:absolute;inset:0}
.stage-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 6px}
.stage-head h3{margin:0;font-size:clamp(1.05rem,2.4vw,1.35rem);color:var(--muted)}
.empty-note{background:var(--paper);border:3px dashed var(--line);border-radius:16px;padding:14px 16px;font-weight:700;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:4px 0 6px}
.tchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 6px;border:3px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--muted);font-weight:800;filter:grayscale(1) opacity(.6)}
.tchip.on{background:var(--lc);color:var(--lf);filter:none;box-shadow:0 4px 0 var(--line)}
.tchip .tc-b{font-family:var(--ui);font-size:.72rem}
.tchip .tc-l{font-family:var(--kid);font-size:1.35rem;line-height:1.05}
.tchip .tc-s{font-family:var(--ui);font-size:.66rem;letter-spacing:.04em}
.tchip:active{transform:translateY(2px)}
.lesson-ed.dim{opacity:.5}
.off-tag{font-size:.75rem;font-weight:800;background:#FFA3A3;color:#23264A;border:2px solid var(--line);border-radius:8px;padding:0 8px}
.blocks{margin-bottom:6px}
.sel-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-weight:700}
.sec{font-size:clamp(1.4rem,3vw,1.9rem);margin:34px 0 14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 var(--line);transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile .ico{grid-row:span 3;font-size:2.4rem;width:72px;height:72px;display:grid;place-items:center;background:var(--tb);border:3px solid var(--line);border-radius:20px}
.tile b{font-size:1.25rem;line-height:1.1}
.tile .vi{font-weight:700;color:var(--muted);font-size:.95rem;line-height:1.2}
.tile .d{font-size:.95rem;line-height:1.3}

/* game shell */
.g-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.g-title h2{margin:0;font-size:clamp(1.5rem,3.2vw,2.2rem)}
.g-sub{color:var(--muted);font-weight:700}
.g-desc{margin:8px 0 16px;max-width:75ch;color:var(--muted)}
.g-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800}
.tl{display:inline-flex;align-items:center;gap:4px;font-weight:800;border-bottom:4px solid var(--tc)}
.lchip{display:inline-block;background:var(--lc);color:var(--lf);border:3px solid var(--line);border-radius:12px;padding:0 .45em;font-family:var(--kid);font-weight:700}
.status{font-size:clamp(1.1rem,2.2vw,1.4rem);font-weight:800;margin:0;min-height:1.5em}

/* shared */
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-4deg)}40%,80%{transform:translateX(10px) rotate(4deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.right{outline:6px solid #22B573;outline-offset:3px}
.wrong{outline:6px solid #E63946;outline-offset:3px;animation:shake .45s}
.buzzers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:14px}
.buzzer{min-height:92px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;background:var(--tc);color:#fff;border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);font-weight:800;font-size:1.35rem;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.buzzer:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line)}
.buzzer kbd{font-family:var(--ui);background:#fff;color:#23264A;text-shadow:none;border:2px solid var(--line);border-radius:8px;padding:0 10px;font-size:1rem}
.buzzer.locked{filter:grayscale(1);opacity:.45}
.buzzer.won{outline:6px solid var(--sun);outline-offset:3px;animation:bump .5s}
.buzzer:disabled{cursor:default}

/* castle */
.castle-stage{position:relative;height:clamp(500px,72vh,780px);background:linear-gradient(180deg,#BFE6FF 0 14%,#A6DC84 14% 100%);border:4px solid var(--line);border-radius:26px;overflow:hidden;touch-action:manipulation}
.castle-stage::before{content:'';position:absolute;left:12%;right:12%;top:14%;bottom:0;background:#E3C99A;opacity:.55;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:6;pointer-events:none}
.wall{position:absolute;left:0;right:0;bottom:0;height:clamp(120px,18vh,160px);display:flex;justify-content:space-around;align-items:flex-start;gap:8px;padding:0 10px;background:#B9A58B repeating-linear-gradient(0deg,transparent 0 30px,rgba(35,38,74,.3) 30px 33px);border-top:5px solid var(--line);z-index:4}
.wall.hit{animation:shake .45s}
.tower{position:relative;margin-top:-54px;flex:0 1 150px;min-width:70px;height:calc(100% + 54px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:var(--lc);color:var(--lf);border:4px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;font-family:var(--kid);font-weight:700;font-size:clamp(2rem,4.6vw,3.2rem);line-height:1}
.tower::before{content:'';position:absolute;top:-20px;left:-4px;right:-4px;height:20px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,var(--lc) 4px 22px,var(--line) 22px 26px,transparent 26px 38px)}
.tower small{font-size:1rem;margin-top:4px}
.tower kbd{font-family:var(--ui);font-size:.8rem;background:#fff;color:#23264A;border:2px solid var(--line);border-radius:6px;padding:0 6px;margin-top:8px}
.tower:active{transform:translateY(4px)}
.tower.fire{animation:bump .3s}
.tower.nope{animation:shake .45s}
.tower.hint{outline:6px dashed var(--sun);outline-offset:4px}
.creep{position:absolute;z-index:3;width:124px;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity .35s,transform .35s}
.creep .sign{display:flex;flex-direction:column;align-items:center;padding:4px 10px 2px;background:#fff;color:#23264A;border:4px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.creep .sign .emo{font-size:3rem;line-height:1.1}
.creep .sign .fw{font-family:var(--kid);font-weight:700;font-size:1.15rem}
.creep .stick{width:5px;height:12px;background:var(--line)}
.creep .body{width:68px;height:52px;display:flex;justify-content:center;gap:6px;padding-top:10px;background:var(--cc);border:4px solid var(--line);border-radius:50% 50% 40% 40%;animation:wobble .5s ease-in-out infinite alternate}
.creep .body i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 50% 62%,#23264A 34%,#fff 37%)}
.creep.aim .sign{outline:5px solid #E63946;outline-offset:3px}
.creep.dead{opacity:0;transform:scale(1.5)}
@keyframes wobble{to{transform:rotate(7deg) translateY(-3px)}}
.bullet{position:absolute;z-index:5;width:28px;height:28px;border-radius:50%;background:var(--lc);border:4px solid var(--line);pointer-events:none;transition:left .28s linear,top .28s linear}
.boom{position:absolute;z-index:6;font-size:3.4rem;pointer-events:none;animation:floatUp .8s forwards}

/* wheel */
.wheel-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.wheel-box{position:relative;width:min(430px,84vw);aspect-ratio:1;justify-self:center;margin-top:14px}
.wheel-box svg{display:block;width:100%;height:100%;cursor:pointer;transition:transform 4.8s cubic-bezier(.12,.72,.1,1)}
.pointer{position:absolute;top:-16px;left:50%;z-index:2;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid #E63946;filter:drop-shadow(0 3px 0 var(--line))}
.hub{position:absolute;top:50%;left:50%;z-index:2;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;padding:0;background:var(--sun);color:#23264A;border:5px solid var(--line);border-radius:50%;font-weight:800;font-size:clamp(1rem,2.6vw,1.3rem)}
.hub:disabled{filter:grayscale(.6)}
.wheel-side{display:grid;gap:12px;background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:18px}
.big-timer{font-size:clamp(2.4rem,6vw,3.4rem);font-weight:800;line-height:1}
.combo{min-height:1.3em;font-weight:800;font-size:1.6rem;color:#E63946}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin-top:18px}
.pcard{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;background:var(--paper);color:var(--ink);border:4px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.pcard .emo{font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.1}
.pcard .fw{font-family:var(--kid);font-weight:700;font-size:1.15rem}
.pcard.hidden{background:repeating-linear-gradient(45deg,#FFD23F 0 14px,#FFC300 14px 28px);color:#23264A;font-size:2.4rem;font-weight:800;cursor:default}
.pcard.got{background:#9BE89B;color:#23264A;transform:scale(.93)}
.pcard.no{background:#FFA3A3;color:#23264A;animation:shake .45s}
.pcard.miss{outline:5px dashed #E63946;outline-offset:3px;animation:bump .5s 2}
/* flip */
.flip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6vw,18px);max-width:920px;margin:0 auto}
.fcard{position:relative;aspect-ratio:1.05;padding:0;border:0;background:none;perspective:900px}
.fcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s}
.fcard.up .inner,.fcard.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.back{background:repeating-linear-gradient(45deg,#FFD23F 0 14px,#FFC300 14px 28px);color:#23264A;font-size:clamp(2rem,5vw,3.2rem);font-weight:800}
.fnum{width:clamp(48px,10vw,72px);aspect-ratio:1;display:grid;place-items:center;background:#fff;color:#23264A;border:4px solid var(--line);border-radius:50%;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1;box-shadow:0 4px 0 var(--line)}
.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink)}
.front.letter{background:var(--lc);color:var(--lf);font-family:var(--kid);font-weight:700;font-size:clamp(2rem,6vw,3.8rem)}
.front.letter small{font-size:clamp(.8rem,1.8vw,1.1rem);margin-top:6px}
.front .emo{font-size:clamp(2.2rem,6vw,4.2rem)}
.front .fw{font-family:var(--kid);font-weight:700;font-size:clamp(.95rem,2.2vw,1.4rem);margin-top:6px}
.fcard.matched .face{box-shadow:0 0 0 5px #22B573}
.fcard.matched{opacity:.8}

/* zoom */
.zoom-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.zoom-box{position:relative;width:100%;max-width:520px;aspect-ratio:1;justify-self:center;display:grid;place-items:center;background:#fff;border:5px solid var(--line);border-radius:30px;overflow:hidden}
.zoom-box span{font-size:clamp(130px,26vw,300px);line-height:1;transition:transform .9s ease}
.zoom-side{display:grid;gap:14px;background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:16px}
.z-pts{font-weight:800;font-size:1.3rem}
.z-pts b{font-size:3rem;line-height:1}
.meter{display:flex;gap:6px}
.meter i{flex:1;height:14px;border:3px solid var(--line);border-radius:8px;background:var(--sun)}
.meter i.used{background:var(--bg2)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:14px 8px;background:var(--bg2);border:4px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);font-family:var(--kid);font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700}

/* whack */
.whack-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.target{display:flex;align-items:center;gap:10px;font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:800;background:var(--paper);border:4px solid var(--line);border-radius:20px;padding:6px 16px}
.target .lchip{font-size:1.4em}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,26px);background:var(--grass);border:4px solid var(--line);border-radius:28px;padding:clamp(12px,3vw,34px)}
.hole{position:relative;aspect-ratio:1.2;overflow:hidden}
.pit{position:absolute;left:6%;right:6%;bottom:4%;height:30%;background:#3D2616;border:4px solid var(--line);border-radius:50%}
.lip{position:absolute;left:6%;right:6%;bottom:4%;height:15%;background:#3D2616;border:4px solid var(--line);border-top:0;border-radius:0 0 50% 50%/0 0 100% 100%;z-index:2}
.mole{position:absolute;left:17%;right:17%;bottom:12%;height:76%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 10%;background:var(--paper);color:var(--ink);border:4px solid var(--line);border-radius:26px 26px 12px 12px;transform:translateY(115%);transition:transform .18s ease-out;touch-action:manipulation}
.mole.up{transform:translateY(0)}
.mole .emo{font-size:clamp(1.8rem,6vw,3.6rem);line-height:1.1}
.mole .mw{font-family:var(--kid);font-weight:700;font-size:clamp(.8rem,2vw,1.3rem)}
.mole.hit{background:#9BE89B}
.mole.bad{background:#FFA3A3}

/* train */
.train-scene{background:var(--bg2);border:4px solid var(--line);border-radius:26px;overflow:hidden}
.t-info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px}
.rail{position:relative;height:clamp(170px,22vw,210px);overflow:hidden}
.track{position:absolute;left:0;right:0;bottom:10px;height:12px;background:repeating-linear-gradient(90deg,#8A5A3C 0 10px,transparent 10px 30px);border-top:4px solid #6B7280}
.train{position:absolute;left:2%;bottom:36px;display:flex;align-items:flex-end;gap:8px;transition:transform 2.6s ease-in}
.train.leave{transform:translateX(130vw)}
.wagon,.engine{position:relative;border:4px solid var(--line);border-radius:12px}
.wagon{width:clamp(74px,11vw,118px);height:clamp(70px,9vw,94px);background:var(--paper);border-top:14px solid var(--lc);display:grid;place-items:center}
.wagon .slot{font-size:clamp(1.6rem,4vw,2.8rem);color:var(--muted);font-weight:800;line-height:1}
.wagon.full{animation:bump .4s}
.engine{width:clamp(110px,15vw,160px);height:clamp(92px,12vw,124px);background:var(--lc);color:var(--lf);border-radius:12px 40px 12px 12px;display:grid;place-items:center;font-family:var(--kid);font-weight:700;font-size:clamp(2rem,5vw,3.2rem)}
.engine .chimney{position:absolute;top:-30px;right:24%;width:24px;height:30px;background:#23264A;border-radius:6px 6px 0 0}
.wheels{position:absolute;bottom:-20px;left:8%;right:8%;display:flex;justify-content:space-between}
.wheels i{width:26px;height:26px;border-radius:50%;background:#4B5563;border:4px solid var(--line)}
.conveyor{border-top:4px solid var(--line);padding:22px 14px;background:repeating-linear-gradient(90deg,#6B7289 0 22px,#5B6275 22px 44px);background-size:44px 100%;animation:belt 1.4s linear infinite}
@keyframes belt{to{background-position:-44px 0}}
.belt{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.box{width:clamp(96px,12vw,128px);display:flex;flex-direction:column;align-items:center;padding:8px 4px;background:#E9B872 linear-gradient(90deg,transparent 44%,rgba(0,0,0,.13) 44% 56%,transparent 56%);color:#23264A;border:4px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--line);touch-action:none;user-select:none;cursor:grab}
.box .emo{font-size:clamp(2rem,4.5vw,3rem);line-height:1.1}
.box .fw{font-family:var(--kid);font-weight:700;font-size:1.15rem}
.box.dragging{z-index:100;transform:scale(1.1) rotate(-4deg)}
.box.gone{visibility:hidden}
.box.shake{animation:shake .45s}

/* learn */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{padding:5px 14px;border:3px solid var(--line);border-radius:14px;background:var(--paper);font-weight:800}
.tab[aria-selected="true"]{background:var(--lc);color:var(--lf)}
.learn{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px;align-items:start}
.big-letter{width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lc);color:var(--lf);border:5px solid var(--line);border-radius:32px;box-shadow:0 8px 0 var(--line);font-family:var(--kid);font-weight:700;font-size:clamp(4rem,10vw,7rem);line-height:1}
.big-letter{overflow:hidden;word-break:break-word;text-align:center}
.big-letter small{font-size:1.6rem;margin-top:8px}
.big-letter .hint{font-family:var(--ui);font-size:1rem;margin-top:12px}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;background:var(--paper);color:var(--ink);border:4px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);text-align:center}
.wcard .emo{font-size:4.2rem;line-height:1.1}
.wcard .ww{font-family:var(--kid);font-weight:700;font-size:2rem;line-height:1.15}
.fl{background:var(--lc);color:var(--lf);border-radius:8px;padding:0 3px}
.wcard .ipa{font-family:var(--kid);color:var(--muted)}
.wcard .vn{font-weight:700}
.wcard.speaking{outline:6px solid var(--sun);outline-offset:3px}

/* teacher */
.panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font-size:1.4rem}
.panel p{margin:0 0 10px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:.95rem}
input,select{background:var(--bg2);border:3px solid var(--line);border-radius:12px;padding:.4em .6em;min-width:0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.lesson-ed{border:3px solid var(--line);border-left:12px solid var(--lc);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.le-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.le-head .sp{flex:1}
.wlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.wlist li{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:4px 6px 4px 10px}
.wlist .emo{font-size:1.6rem}
.wlist .grow{flex:1;min-width:0;line-height:1.2}
.wlist small{color:var(--muted)}
.x{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-weight:800}
.addform{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end;margin-top:12px}
.addform h4{grid-column:1/-1;margin:6px 0 0;font-size:1.15rem}
.palette{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.palette button{font-size:1.5rem;width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:var(--bg2);padding:0}

/* overlay, toast, fx */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(15,20,55,.55);animation:fade .2s}
.ov-card{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border:5px solid var(--line);border-radius:30px;box-shadow:0 10px 0 var(--line);padding:24px clamp(18px,4vw,40px);text-align:center}
.ov-card h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:.1em 0 .2em}
.ov-card p{font-size:1.15rem;margin:.3em 0}
.ov-emoji{font-size:4rem;line-height:1.1}
.ov-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ov-btns .btn{font-size:1.2rem}
.rank{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;text-align:left}
.rank li{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.2rem;border-left:10px solid var(--tc)}
.rank li .sp{flex:1}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:300;max-width:min(92vw,640px);background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 20px;font-weight:800;font-size:1.1rem;text-align:center;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
.float{position:fixed;z-index:250;pointer-events:none;font-weight:800;font-size:2rem;color:#22B573;-webkit-text-stroke:1.5px #23264A;animation:floatUp 1.1s ease-out forwards}
.float.neg{color:#E63946}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
.confetti{position:fixed;top:-20px;z-index:260;width:12px;height:18px;pointer-events:none;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== 9. Pop Balloon ===== */
.balloon-stage{position:relative;height:clamp(480px,70vh,760px);background:linear-gradient(180deg,#BFE6FF,#E8F7FF);border:4px solid var(--line);border-radius:26px;overflow:hidden;touch-action:manipulation}
.balloon-stage .cloud{position:absolute;font-size:3rem;opacity:.7;animation:drift 22s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.balloon{position:absolute;bottom:-160px;width:96px;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.balloon .bub{position:relative;width:88px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.85),transparent 45%),var(--bc);border:4px solid var(--line);border-radius:50% 50% 50% 50%/46% 46% 54% 54%}
.balloon .bub::after{content:'';position:absolute;bottom:-9px;width:12px;height:12px;background:var(--bc);border:4px solid var(--line);border-top:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.balloon .emo{font-size:2.5rem;line-height:1}
.balloon .fw{font-family:var(--kid);font-weight:700;font-size:.95rem;color:#23264A}
.balloon .str{width:2px;height:34px;background:var(--line)}
.balloon.pop{animation:popper .35s forwards}
@keyframes popper{60%{transform:scale(1.3)}100%{transform:scale(.1);opacity:0}}
.balloon.deflate{animation:defl .5s forwards}
@keyframes defl{to{transform:translateY(80px) scale(.3) rotate(40deg);opacity:0}}

/* ===== 10. Tug of War ===== */
.tug-wrap{display:grid;gap:16px}
.tug-field{position:relative;height:150px;background:#A6DC84;border:4px solid var(--line);border-radius:22px;overflow:hidden;display:flex;align-items:center}
.tug-field .center-line{position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--line);transform:translateX(-50%);z-index:1}
.tug-field .zone{position:absolute;top:0;bottom:0;width:16%;opacity:.28}
.tug-field .zL{left:0;background:repeating-linear-gradient(45deg,var(--c0) 0 12px,transparent 12px 24px)}
.tug-field .zR{right:0;background:repeating-linear-gradient(-45deg,var(--c1) 0 12px,transparent 12px 24px)}
.rope{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:0;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.3,1.4,.5,1);z-index:2}
.rope .line{width:min(60vw,560px);height:8px;background:repeating-linear-gradient(90deg,#8A5A3C 0 12px,#6B4522 12px 24px);border:2px solid var(--line);border-radius:4px}
.rope .knot{width:26px;height:26px;background:#FFD23F;border:4px solid var(--line);border-radius:50%;flex:0 0 auto}
.rope .pull{font-size:2.6rem}
.rope .pull.left{transform:scaleX(-1)}
.tug-center{display:grid;place-items:center;gap:6px;background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:14px}
.tug-center .emo{font-size:clamp(4rem,12vw,7rem);line-height:1}
.tug-teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tug-side{background:var(--paper);border:4px solid var(--line);border-radius:22px;border-top:12px solid var(--tc);padding:12px}
.tug-side h4{margin:0 0 8px;display:flex;align-items:center;gap:8px}
.tug-side .keys{color:var(--muted);font-weight:700;font-size:.9rem}
.tug-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tug-btns .lcard{min-width:0;font-size:2rem;padding:8px 4px}
.tug-btns .lcard small{font-size:.8rem}

/* ===== 11. Word Maze ===== */
.maze-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.maze-grid{display:grid;gap:8px;max-width:560px;margin:0 auto;background:#6B4522;border:5px solid var(--line);border-radius:20px;padding:10px}
.cell{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--line);border-radius:12px;cursor:pointer;overflow:hidden}
.cell .emo{font-size:clamp(1.6rem,5vw,2.6rem);line-height:1}
.cell .fw{font-family:var(--kid);font-weight:700;font-size:.8rem}
.cell.wall{background:#3D2616;cursor:default}
.cell.visited{background:#C8F0C8}
.cell.hero{outline:5px solid var(--sun);outline-offset:-3px;z-index:2}
.cell .who{position:absolute;font-size:clamp(1.8rem,5.5vw,2.8rem);z-index:3}
.cell.goal{background:#FFF1C2}
.cell.trap{animation:shake .4s}
.cell.reach::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 4px var(--sun);border-radius:9px;opacity:.7}

/* ===== 12. Conveyor Belt ===== */
.belt-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.belt-scene{position:relative;height:clamp(200px,30vh,260px);background:var(--bg2);border:4px solid var(--line);border-radius:22px;overflow:hidden}
.belt-line{position:absolute;left:0;right:0;top:24px;height:96px;background:repeating-linear-gradient(90deg,#6B7289 0 22px,#5B6275 22px 44px);background-size:44px 100%;border-top:4px solid var(--line);border-bottom:4px solid var(--line);animation:belt 1.2s linear infinite}
.parcel{position:absolute;top:34px;width:92px;display:flex;flex-direction:column;align-items:center;padding:8px 4px;background:#E9B872 linear-gradient(90deg,transparent 44%,rgba(0,0,0,.13) 44% 56%,transparent 56%);color:#23264A;border:4px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--line);touch-action:none;user-select:none;cursor:grab}
.parcel .emo{font-size:2.2rem;line-height:1.05}
.parcel .fw{font-family:var(--kid);font-weight:700;font-size:1rem}
.parcel.dragging{z-index:100;transform:scale(1.1) rotate(-4deg)}
.parcel.gone{visibility:hidden}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-top:14px}
.bin{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lc);color:var(--lf);border:4px solid var(--line);border-radius:16px 16px 10px 10px;box-shadow:0 6px 0 var(--line);font-family:var(--kid);font-weight:700;font-size:2rem;line-height:1}
.bin small{font-size:.9rem}
.bin.over{outline:5px solid var(--sun);outline-offset:3px;transform:translateY(-3px)}
.bin.hit{animation:bump .4s}
.bin.miss{animation:shake .4s}

/* ===== 13. Memory Matrix ===== */
.mm-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,16px);max-width:520px;margin:0 auto}
.mm-cell{position:relative;aspect-ratio:1;padding:0;border:0;background:none;perspective:900px}
.mm-cell .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s}
.mm-cell.down .inner{transform:rotateY(180deg)}
.mm-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mm-front{background:var(--paper);color:var(--ink)}
.mm-front .emo{font-size:clamp(2.4rem,7vw,4rem)}
.mm-front .fw{font-family:var(--kid);font-weight:700;font-size:clamp(.9rem,2.4vw,1.3rem)}
.mm-back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#8338EC 0 14px,#6f2bd0 14px 28px);color:#fff;font-size:2.6rem;font-weight:800}
.mmnum{width:clamp(46px,10vw,68px);aspect-ratio:1;display:grid;place-items:center;background:#fff;color:#23264A;border:4px solid var(--line);border-radius:50%;font-size:clamp(1.5rem,4vw,2.4rem);line-height:1;box-shadow:0 4px 0 var(--line)}
.mm-cell.got .mm-face{box-shadow:0 0 0 5px #22B573}
.mm-cell.no .mm-face{box-shadow:0 0 0 5px #E63946}
.mm-cell.reveal .mm-face{box-shadow:0 0 0 5px var(--sun)}

/* ===== 14. Space Invaders ===== */
.space-stage{position:relative;height:clamp(500px,72vh,780px);background:radial-gradient(circle at 30% 20%,#2b2f6e,#0d1030);border:4px solid var(--line);border-radius:26px;overflow:hidden;touch-action:none}
.space-stage .star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.8}
.radar{position:absolute;top:10px;left:10px;right:10px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.meteor{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;padding:6px 4px;background:radial-gradient(circle at 34% 30%,#9a7b53,#5f4225);color:#fff;border:4px solid var(--line);border-radius:50%;pointer-events:none}
.meteor .emo{font-size:2.2rem;line-height:1;filter:drop-shadow(0 0 2px #000)}
.meteor .fw{font-family:var(--kid);font-weight:700;font-size:.9rem}
.meteor.boom{animation:floatUp .5s forwards}
.ship{position:absolute;bottom:14px;width:84px;height:70px;transform:translateX(-50%);z-index:5;transition:left .06s linear;display:grid;place-items:center;font-size:3.4rem;filter:drop-shadow(0 0 6px #4da6ff)}
.laser{position:absolute;width:8px;border-radius:4px;background:linear-gradient(#fff,#4da6ff);box-shadow:0 0 8px #4da6ff;z-index:4;pointer-events:none}
.space-ctrl{position:absolute;bottom:14px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.space-ctrl button{pointer-events:auto;width:70px;height:70px;font-size:1.8rem;border-radius:50%;border:4px solid var(--line);background:rgba(255,255,255,.9);color:#23264A;box-shadow:0 5px 0 var(--line)}
.space-ctrl .fire{width:96px;border-radius:26px;background:#FFD23F}

.mic{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 14px;margin:8px 0}
.mic.mic-off{display:block;background:#FFF4D6;color:#23264A;font-weight:700;line-height:1.5}
.mic-btn{width:62px;height:62px;font-size:1.9rem;border-radius:50%;border:3px solid var(--line);background:var(--sun);box-shadow:0 4px 0 var(--line);flex:0 0 auto}
.mic-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mic.listening .mic-btn{background:#FF6B6B;color:#fff;animation:micpulse 1s infinite}
@keyframes micpulse{50%{box-shadow:0 4px 0 var(--line),0 0 0 12px rgba(255,107,107,.28)}}
.mic-info{flex:1;min-width:0}
.mic-state{font-weight:800}
.mic-state.warn{color:#E63946}
.mic-heard{color:var(--muted);font-weight:700;min-height:1.25em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.speak-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:22px;margin:10px 0}
.speak-card .emo{font-size:clamp(5rem,17vw,9.5rem);line-height:1}
.speak-card .fw{font-family:var(--kid);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.8rem)}
.tile.voice{border-style:solid;box-shadow:0 6px 0 var(--line),0 0 0 3px #FF6B6B inset}
.tile.voice .ico{background:#FFD6E0}
@media (max-width:700px){
  .quiz,.zoom-wrap,.learn{grid-template-columns:1fr}
  .mystery{justify-self:center}
  .big-letter{max-width:220px;justify-self:center}
  .lane{grid-template-columns:1fr}
  .top{justify-content:center}
  .t-name{max-width:6em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',when=0,vol=.18,f2){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();const t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}

  good(){tone(660,.15,'triangle');tone(990,.28,'triangle',.12)},

  tick(){tone(1250,.05,'square',0,.05)},
  buzz(){tone(520,.12,'square',0,.12);tone(780,.22,'square',.1,.12)},
  chomp(){[0,.16,.32].forEach(t=>tone(190,.09,'square',t,.14,90))},
  choo(){[0,.75].forEach(t=>{tone(466,.6,'sawtooth',t,.07);tone(587,.6,'sawtooth',t,.07)})},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',i*.12,.15))}
};

const ROBOTIC=/espeak|e-speak|compact|pico|festival|flite|default\)|android/i;
function voiceScore(v){
  const n=v.name;let s=0;
  if(/^en[-_]US/i.test(v.lang))s+=30;else if(/^en[-_](GB|AU|CA|IE)/i.test(v.lang))s+=22;else if(/^en/i.test(v.lang))s+=8;else s-=200;
  // Best tiers: Microsoft "Natural"/Neural online voices, Apple premium/enhanced, Google network voices
  if(/Natural/i.test(n))s+=90;else if(/Neural/i.test(n))s+=80;else if(/Online|Multilingual/i.test(n))s+=55;
  if(/Google US English/i.test(n))s+=70;else if(/Google UK English (Fe)?male/i.test(n))s+=55;else if(/^Google/i.test(n))s+=40;
  if(/\((Premium|Enhanced)\)|Premium|Enhanced/i.test(n))s+=45;
  // Named high-quality voices
  if(/\b(Ava|Zoe|Samantha|Allison|Susan|Joelle|Nicky|Siri)\b/i.test(n))s+=40;
  if(/\b(Aria|Jenny|Emma|Michelle|Sonia|Libby|Nova|Guy|Andrew|Christopher|Eric|Steffan|Ryan)\b/i.test(n))s+=32;
  if(/\b(Serena|Karen|Moira|Tessa|Fiona|Kate|Daniel|Oliver|Arthur)\b/i.test(n))s+=24;
  if(/Microsoft/i.test(n))s+=6;
  if(NOVELTY.test(n))s-=300;
  if(ROBOTIC.test(n))s-=250;
  if(/en[-_]US/i.test(v.lang)&&!v.localService)s+=8; // network voices usually clearer
  return s;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const voiceInputOK=!!SR;
let curRecog=null,recogWant=false;
function stopRecog(){recogWant=false;if(curRecog){try{curRecog.onend=null;curRecog.onresult=null;curRecog.onerror=null;curRecog.onstart=null;curRecog.abort()}catch(e){}curRecog=null}}
function vnorm(s){return (s||'').toLowerCase().replace(/[^a-z]+/g,' ').replace(/\s+/g,' ').trim()}
function editDist(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function saidWord(alts,target){target=vnorm(target);if(!target)return false;const tol=target.length<=4?1:2;
  for(const raw of alts){const nt=vnorm(raw);if(!nt)continue;if(nt===target||nt.replace(/ /g,'')===target)return true;
    for(const tok of nt.split(' ')){if(tok===target)return true;if(tok.length>=3&&(tok.startsWith(target)||target.startsWith(tok)))return true;if(editDist(tok,target)<=tol)return true}}
  return false}
function startListen(onHeard,onState){
  if(!voiceInputOK){onState&&onState('unsupported');return}
  stopRecog();recogWant=true;

    r.onstart=()=>onState&&onState('listening');
    r.onresult=e=>{const alts=[];let fin=false;for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)fin=true;for(let j=0;j<res.length;j++)alts.push(res[j].transcript)}onHeard&&onHeard(alts,fin)};
    r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){recogWant=false;onState&&onState('denied')}};
    r.onend=()=>{curRecog=null;if(recogWant)setTimeout(begin,150);else onState&&onState('stopped')};
    try{r.start()}catch(e){setTimeout(()=>{if(recogWant)begin()},300)}};

}

const timers={i:[],t:[],r:0};

function draggable(el,o){
  let sx,sy,ox,oy,moved=false,on=false;

/* ============ SOUND CASTLE DEFENSE ============ */
screens.castle=()=>{
  if(!need(2))return;const voice=voiceMode;
  const ls=activeLessons().slice(0,6),WAVE=8,HP=5;
  const CREEP=['#9BE08F','#C39BFF','#FF9EC7','#8FD6FF','#FFB86B'];
  const spd={slow:{fall:16000,max:1,gap:1800},mid:{fall:12000,max:2,gap:3200},fast:{fall:8500,max:2,gap:2200}}[settings.speed]||{fall:16000,max:1,gap:1800};
  const words=pool().filter(w=>ls.some(l=>l.id===w.lid));
  shell(`🏰 Sound Castle Defense${voice?' 🎤':''}`,voice?'Thủ thành bằng giọng nói':'Thủ thành Phonics',
    voice?`Sâu tí hon mang hình bò về phía thành. NÓI TO từ trên con sâu gần thành nhất (khung đỏ) vào micro để bắn hạ nó (+100). Để sâu chạm thành thì mất 1 ❤️.`:`Sâu tí hon mang hình đang bò về phía thành. Đội phòng thủ bấm thật nhanh vào tháp có âm đầu giống hình trên đầu con sâu có khung đỏ (hoặc bấm phím số 1–${ls.length}). Đúng thì tháp bắn hạ sâu (+100). Bấm sai tháp hoặc để sâu chạm thành thì mất 1 ❤️.`,
  `<div class="castle-stage" id="cs"><div class="hud"><span class="pill" id="cwho"></span><span class="pill" id="chp"></span><span class="pill" id="cleft"></span></div>
   <div class="wall" id="wall">${ls.map((l,i)=>`<button class="tower" data-lid="${l.id}" style="${lsty(l)}" aria-label="Tháp ${esc(l.letter)}">${esc(l.letter)}<small>${esc(l.sound)}</small>${voice?'':`<kbd>${i+1}</kbd>`}</button>`).join('')}</div></div>
   ${voice?micHTML():''}`);
  const cs=$('#cs'),wall=$('#wall'),towers=$$('.tower');
  let t=0,hp=HP,spawned=0,creeps=[],running=false,last=0,lastSpawn=0;
  function listenCastle(){beginListening(alts=>{if(!running)return;const c=front();if(!c)return;
    if(saidWord(alts,c.w.w)){const tw=towers.find(x=>x.dataset.lid===c.w.lid);if(tw)fire(tw)}});}
  const hud=()=>{$('#cwho').innerHTML=`Phòng thủ: ${teamLabel(t%teams.length)}`;$('#chp').textContent='❤️'.repeat(Math.max(0,hp))+'🤍'.repeat(HP-Math.max(0,hp));$('#cleft').textContent=`Sâu: ${spawned}/${WAVE}`};
  const place=c=>{c.el.style.left=c.x+'px';c.el.style.top=c.y+'px'};
  const front=()=>creeps.reduce((a,c)=>!a||c.y>a.y?c:a,null);
  function prep(){
    if(t>=teams.length*ROUNDS){results('Các thành trì đã được bảo vệ!',()=>go('castle'));return}
    hp=HP;spawned=0;hud();
    turnCard(t%teams.length,voice?`Có ${WAVE} con sâu đang tiến về thành. Thành có ${HP} ❤️. NÓI TO từ trên con sâu khung đỏ để bắn hạ nó nhé!`:`Có ${WAVE} con sâu đang tiến về thành. Thành có ${HP} ❤️. Nghe từ, nhìn hình rồi bấm đúng tháp nhé!`,start);
  }
  function start(){running=true;last=performance.now();lastSpawn=-1e9;frame(loop);if(voice)listenCastle()}
  function spawn(){
    const w=pick(words),el=document.createElement('div');el.className='creep';el.style.setProperty('--cc',pick(CREEP));
    el.innerHTML=`<div class="sign"><span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span></div><span class="stick"></span><div class="body"><i></i><i></i></div>`;
    cs.appendChild(el);const c={el,w,x:rand(10,Math.max(12,cs.clientWidth-134)),y:48};creeps.push(c);place(c);spawned++;hud();say(w.w);
  }
  function loop(now){
    const dt=Math.min(64,now-last);last=now;
    if(running){
      const wallTop=wall.offsetTop+towers[0].offsetTop-16;
      [...creeps].forEach(c=>{c.y+=dt*(wallTop/spd.fall);place(c);if(c.y+c.el.offsetHeight>=wallTop)breach(c)});
      const f=front();creeps.forEach(c=>c.el.classList.toggle('aim',c===f));
      if(running&&spawned<WAVE&&creeps.length<spd.max&&now-lastSpawn>spd.gap){spawn();lastSpawn=now}
      if(running&&spawned>=WAVE&&!creeps.length)endWave();
    }
    frame(loop);
  }
  function removeCreep(c){creeps=creeps.filter(x=>x!==c);c.el.classList.add('dead');setTimeout(()=>c.el.remove(),400)}
  function damage(){hp--;hud();wall.classList.remove('hit');void wall.offsetWidth;wall.classList.add('hit');if(hp<=0)endWave()}
  function breach(c){
    removeCreep(c);sfx.bad();const tw=towers.find(x=>x.dataset.lid===c.w.lid);
    if(tw){tw.classList.add('hint');later(()=>tw.classList.remove('hint'),1500)}
    toast(`"${c.w.w}" chạm thành rồi! Đó là âm ${c.w.lesson.sound}`);damage();
  }
  function fire(tw){
    if(!running)return;const c=front();if(!c)return;const l=lessons.find(x=>x.id===tw.dataset.lid);
    if(tw.dataset.lid===c.w.lid){
      creeps=creeps.filter(x=>x!==c);tw.classList.remove('fire');void tw.offsetWidth;tw.classList.add('fire');
      const L=l.letter[0].toUpperCase();say(`${L}. ${L}. ${c.w.w}!`,.95);
      const cr=cs.getBoundingClientRect(),tr=tw.getBoundingClientRect(),er=c.el.getBoundingClientRect();
      const b=document.createElement('span');b.className='bullet';b.style.cssText=`${lsty(l)};left:${tr.left-cr.left+tr.width/2-14}px;top:${tr.top-cr.top}px`;cs.appendChild(b);
      const tx=er.left-cr.left+er.width/2-14,ty=er.top-cr.top+er.height/2-14;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.left=tx+'px';b.style.top=ty+'px'}));
      setTimeout(()=>{b.remove();sfx.good();const bm=document.createElement('span');bm.className='boom';bm.textContent='💥';bm.style.left=(tx-20)+'px';bm.style.top=(ty-20)+'px';cs.appendChild(bm);setTimeout(()=>bm.remove(),800);c.el.classList.add('dead');setTimeout(()=>c.el.remove(),400)},300);
      addScore(t%teams.length,100);
    }else{
      sfx.bad();tw.classList.remove('nope');void tw.offsetWidth;tw.classList.add('nope');toast(`"${c.w.w}" không bắt đầu bằng âm ${l.sound}`);damage();
    }
  }
  function endWave(){
    if(!running)return;running=false;stopRecog();
    creeps.forEach(c=>c.el.remove());creeps=[];
    const ok=hp>0,bonus=Math.max(0,hp)*50;if(bonus)addScore(t%teams.length,bonus);
    later(()=>overlay(`<div class="ov-emoji">${ok?'🏰':'💔'}</div><h2>${ok?'Giữ thành thành công!':'Thành bị phá mất rồi!'}</h2><p>${teamLabel(t%teams.length)} ${ok?`còn ${hp} ❤️, được thưởng thêm ${bonus} điểm.`:'hãy cố gắng hơn ở lần sau nhé.'}</p>`,
      [{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),500);
  }
  wall.addEventListener('pointerdown',e=>{const tw=e.target.closest('.tower');if(tw){e.preventDefault();fire(tw)}});
  wall.addEventListener('keydown',e=>{const tw=e.target.closest('.tower');if(tw&&(e.key==='Enter'||e.key===' ')){e.preventDefault();fire(tw)}});
  if(!voice)onKey(e=>{const n=parseInt(e.key,10);if(n>=1&&n<=towers.length){e.preventDefault();fire(towers[n-1])}});
  if(voice)wireMic(()=>{if(running)listenCastle()});
  prep();
};

/* ============ SOUND WHEEL FORTUNE ============ */
screens.wheel=()=>{
  if(!need(2))return;const voice=voiceMode;
  const ls=activeLessons().slice(0,6);
  const base=[];const reps=ls.length<=3?3:ls.length<=4?2:1;for(let r=0;r<reps;r++)ls.forEach(l=>base.push(l));
  const segs=shuffle(base);
  const TIME=20,PER=6,TOTAL=PER*teams.length;
  const N=segs.length,A=360/N,C=210,R=200;
  const P=a=>{const r=a*Math.PI/180;return `${(C+R*Math.sin(r)).toFixed(2)} ${(C-R*Math.cos(r)).toFixed(2)}`};
  const svg=`<svg id="wsvg" viewBox="0 0 420 420" role="img" aria-label="Vòng quay"><circle cx="${C}" cy="${C}" r="${R+6}" fill="#23264A"/>${segs.map((l,i)=>{
    const a0=i*A,mid=a0+A/2,txt=fg(l.color);
    const lab=`<text x="${C}" y="${C-R*.72}" transform="rotate(${mid} ${C} ${C})" text-anchor="middle" dominant-baseline="middle" font-family="Andika, sans-serif" font-weight="700" font-size="${N>10?30:36}" fill="${txt}">${esc(l.letter)}</text><text x="${C}" y="${C-R*.5}" transform="rotate(${mid} ${C} ${C})" text-anchor="middle" dominant-baseline="middle" font-family="Andika, sans-serif" font-weight="700" font-size="16" fill="${txt}">${esc(l.sound)}</text>`;
    return `<path d="M${C} ${C} L${P(a0)} A${R} ${R} 0 0 1 ${P(a0+A)} Z" fill="${l.color}" stroke="#23264A" stroke-width="4"/>${lab}`}).join('')}</svg>`;
  shell('🎡 Sound Wheel Fortune','Vòng quay bắt âm',`Đại diện đội bấm QUAY (hoặc chạm vào vòng quay, phím cách). Dừng ở ô chữ cái nào thì trong ${TIME} giây đội chọn hết các thẻ hình có âm đầu đó. Chọn đúng liên tiếp được cộng combo, tìm đủ sớm được thưởng thêm điểm.`,
  `<div class="wheel-wrap"><div class="wheel-box"><span class="pointer" aria-hidden="true"></span>${svg}<button class="hub" id="hub">QUAY</button></div>
   <div class="wheel-side"><div class="row"><span class="pill" id="wwho"></span><span class="pill" id="wcount"></span></div>
     <p class="status" id="wstatus"></p><div class="row"><span class="big-timer" id="wtime">${TIME}</span><span>giây</span></div><div class="combo" id="combo"></div>${voice?micHTML():''}</div></div>
   <div class="pgrid" id="pgrid"></div>`);
  const wsvg=$('#wsvg'),hub=$('#hub'),grid=$('#pgrid'),status=t=>$('#wstatus').innerHTML=t;
  let rot=0,spinning=false,playing=false,spins=0,over=false,cards=[],target=null,streak=0,found=0,needN=0,left=TIME,tid=null;
  const hiddenGrid=()=>{grid.innerHTML=Array(12).fill('<div class="pcard hidden" aria-hidden="true">?</div>').join('')};
  const upd=()=>{$('#wwho').innerHTML=`Lượt: ${teamLabel(turn)}`;$('#wcount').textContent=`Lượt quay ${Math.min(spins+1,TOTAL)}/${TOTAL}`;hub.disabled=spinning||playing};
  function ready(){upd();status(`${esc(teams[turn].name)} bấm QUAY nhé!`);$('#combo').textContent='';$('#wtime').textContent=TIME}
  function spin(){
    if(spinning||playing||over)return;spinning=true;upd();sfx.pop();
    const i=Math.floor(Math.random()*N),c=i*A+A/2+rand(-A*.3,A*.3);
    const cur=((rot%360)+360)%360;let d=(360-c-cur)%360;if(d<0)d+=360;rot+=360*5+d;
    wsvg.style.transform=`rotate(${rot}deg)`;status('Vòng quay đang quay...');
    for(let k=0;k<18;k++)later(sfx.tick,4700*Math.pow(k/18,1.9));
    later(()=>{spinning=false;play(segs[i])},4950);
  }
  function play(l){
    playing=true;upd();target=l;streak=0;found=0;
    const mine=l.words.map(w=>({...w,lid:l.id})),others=shuffle(pool().filter(w=>w.lid!==l.id));
    cards=shuffle([...mine,...others.slice(0,Math.max(0,12-mine.length))]);needN=mine.length;
    grid.innerHTML=cards.map((w,i)=>`<button class="pcard" data-i="${i}"><span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span></button>`).join('');
    status(`${voice?'NÓI TO':'Chạm chọn'} các từ có âm <span class="lchip" style="${lsty(l)}">${esc(l.letter)} ${esc(l.sound)}</span>${voice?' vào micro':''} (${needN} hình)`);
    say(`Find the ${l.letter[0].toUpperCase()} words!`);
    left=TIME;$('#wtime').textContent=left;
    tid=every(()=>{left--;$('#wtime').textContent=left;if(left<=3&&left>0)sfx.tick();if(left<=0)finish(false)},1000);
    if(voice)listenWheel();
  }
  function gotCard(b,w){
    b.classList.add('got');streak++;found++;const pts=50+(streak-1)*10;addScore(turn,pts);say(w.w);
    tone(520+streak*90,.14,'triangle');tone(780+streak*90,.2,'triangle',.1);
    $('#combo').textContent=streak>=2?`🔥 Combo x${streak}!`:'';
    if(found>=needN)finish(true);
  }
  function listenWheel(){beginListening(alts=>{if(!playing)return;
    for(let i=0;i<cards.length;i++){const b=grid.children[i];if(!b||b.classList.contains('got'))continue;
      if(cards[i].lid===target.id&&saidWord(alts,cards[i].w)){gotCard(b,cards[i]);break}}});}
  grid.onclick=e=>{
    const b=e.target.closest('.pcard');if(!b||!playing||b.classList.contains('got')||b.classList.contains('hidden'))return;
    const w=cards[+b.dataset.i];
    if(w.lid===target.id){gotCard(b,w)}
    else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.bad();streak=0;$('#combo').textContent='';say(w.w)}
  };
  function finish(all){
    if(!playing)return;playing=false;clearInterval(tid);stopRecog();
    if(all){const bonus=left*10;if(bonus)addScore(turn,bonus);sfx.win();status(`Tìm đủ rồi! Thưởng thêm ${bonus} điểm vì còn ${left} giây.`)}
    else{sfx.bad();$$('.pcard',grid).forEach((b,i)=>{if(cards[i].lid===target.id&&!b.classList.contains('got'))b.classList.add('miss')});status('Hết giờ! Các hình có khung đỏ là những hình còn sót.')}
    $$('.pcard',grid).forEach(b=>b.disabled=true);upd();later(endTurn,3200);
  }
  function endTurn(){
    spins++;hiddenGrid();
    if(spins>=TOTAL){over=true;results('Vòng quay đã dừng!',()=>go('wheel'));return}
    nextTurn();
    ready();
  }
  hub.onclick=spin;wsvg.onclick=spin;
  onKey(e=>{if(e.code==='Space'){e.preventDefault();spin()}});
  if(voice)wireMic(()=>{if(playing)listenWheel()});
  hiddenGrid();setTurn(0);ready();
};
/* ============ 3. PHONICS CARD FLIP ============ */
screens.flip=(size=12)=>{
  if(!need(2))return;
  const pairs=size/2,ls=activeLessons();
  const byL=ls.map(l=>shuffle(l.words.map(w=>({...w,lid:l.id,lesson:l}))));
  const chosen=[];for(let k=0;chosen.length<pairs;k++){const arr=byL[k%byL.length];chosen.push(arr[Math.floor(k/byL.length)%arr.length])}
  const cards=shuffle(chosen.flatMap(w=>[{t:'L',lid:w.lid,l:w.lesson},{t:'P',lid:w.lid,w}]));
  shell('🃏 Phonics Card Flip','Lật thẻ ghép cặp','Các ô đều có số để cả lớp dễ gọi tên ("lật ô số 3"). Mỗi lượt một đội lật 2 thẻ: một thẻ chữ cái và một thẻ hình có cùng âm đầu là một cặp đúng (+100 điểm, được lật tiếp). Sai thì thẻ úp lại và chuyển lượt.',
  `<div class="g-tools"><button class="btn small ${size===12?'on':'ghost'}" data-size="12">12 thẻ</button><button class="btn small ${size===16?'on':'ghost'}" data-size="16">16 thẻ</button></div>
   <div class="flip-grid" id="grid">${cards.map((c,i)=>`<button class="fcard" data-i="${i}" aria-label="Thẻ số ${i+1}"><span class="inner"><span class="face back"><b class="fnum">${i+1}</b></span><span class="face front ${c.t==='L'?'letter':''}" style="${c.t==='L'?lsty(c.l):''}">${c.t==='L'?`${esc(c.l.letter)}<small>${esc(c.l.sound)}</small>`:`<span class="emo">${c.w.e}</span><span class="fw">${esc(c.w.w)}</span>`}</span></span></button>`).join('')}</div>`);
  $$('[data-size]').forEach(b=>b.onclick=()=>go('flip',+b.dataset.size));
  let first=null,lock=false,found=0;
  $('#grid').onclick=e=>{
    const b=e.target.closest('.fcard');if(!b||lock||turn<0)return;const c=cards[+b.dataset.i];

      later(()=>{a.b.classList.add('matched');b.classList.add('matched');sfx.good();say((c.t==='P'?c.w:a.c.w).w);addScore(turn,100);found++;lock=false;

    }else{

    }
  };

screens.whack=()=>{
  if(!need(2))return;const voice=voiceMode;
  const ls=activeLessons(),DUR=20;let t=0;
  shell(`🔨 Whack-A-Sound${voice?' 🎤':''}`,voice?'Đập âm bằng giọng nói':'Đập chuột tìm âm',
    voice?'Mỗi đội 20 giây. NÓI TO từ trên con chuột có âm mục tiêu vào micro để đập nó (+50).':'Mỗi đội có 20 giây. Chạm thật nhanh vào các hình có âm đầu được gọi (+50). Chạm nhầm hình âm khác bị trừ 25 điểm.',
  `<div class="whack-top"><div class="target" id="target"></div><span class="pill">⏱ <b id="wt">${DUR}</b> giây</span><span class="pill">Điểm lượt này: <b id="ws">0</b></span></div>
   ${voice?micHTML():''}
   <div class="holes">${[...Array(6)].map((_,i)=>`<div class="hole"><span class="pit"></span><button class="mole" data-h="${i}" tabindex="-1"></button><span class="lip"></span></div>`).join('')}</div>`);
  const moles=$$('.mole'),sp={slow:[1300,2100],mid:[1000,1600],fast:[750,1200]}[settings.speed]||[1300,2100];
  let target,left,tscore=0,running=false,occ=Array(6).fill(null),hideT=Array(6).fill(0);
  function prep(){
    if(t>=teams.length*ROUNDS){results('Hết giờ đập chuột!',()=>go('whack'));return}
    target=ls[t%ls.length];
    $('#target').innerHTML=`Tìm âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>`;
    $('#wt').textContent=DUR;$('#ws').textContent=0;
    turnCard(t%teams.length,`${voice?'NÓI TO':'Đập'} các hình có âm đầu <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span> trong ${DUR} giây.`,start);
  }
  function start(){
    running=true;left=DUR;tscore=0;say(`Catch the ${target.letter[0]} words!`);
    const s=every(spawn,sp[0]);
    const k=every(()=>{left--;$('#wt').textContent=left;if(left<=5&&left>0)sfx.tick();if(left<=0){clearInterval(s);clearInterval(k);end()}},1000);
    later(spawn,600);
    if(voice)listenWhack();
  }
  function spawn(){
    if(!running)return;const free=occ.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!free.length)return;
    const h=pick(free),isT=Math.random()<.5;
    const w=isT?pick(target.words.map(x=>({...x,lid:target.id}))):pick(pool().filter(x=>x.lid!==target.id));
    occ[h]=w;const m=moles[h];m.className='mole';m.innerHTML=`<span class="emo">${w.e}</span><span class="mw">${esc(w.w)}</span>`;
    requestAnimationFrame(()=>m.classList.add('up'));
    hideT[h]=later(()=>hide(h),sp[1]);
  }
  function hide(h){moles[h].classList.remove('up');later(()=>{occ[h]=null},220)}
  function hitMole(h){
    const m=moles[h],w=occ[h];if(!m||!w||!m.classList.contains('up')||m.classList.contains('hit')||m.classList.contains('bad'))return;
    clearTimeout(hideT[h]);
    if(w.lid===target.id){m.classList.add('hit');sfx.good();say(w.w,1.05);tscore+=50;addScore(t%teams.length,50)}
    else{m.classList.add('bad');sfx.bad();tscore-=25;addScore(t%teams.length,-25)}
    $('#ws').textContent=tscore;later(()=>hide(h),380);
  }
  function listenWhack(){beginListening(alts=>{if(!running)return;
    for(let h=0;h<6;h++){const m=moles[h],w=occ[h];if(w&&m.classList.contains('up')&&!m.classList.contains('hit')&&!m.classList.contains('bad')&&w.lid===target.id&&saidWord(alts,w.w)){hitMole(h);break}}});}
  $('.holes').addEventListener('pointerdown',e=>{const m=e.target.closest('.mole');if(!m||!running)return;hitMole(+m.dataset.h)});
  if(voice)wireMic(()=>{if(running)listenWhack()});
  function end(){
    running=false;stopRecog();moles.forEach((m,h)=>hide(h));sfx.win();
    later(()=>overlay(`<div class="ov-emoji">⏰</div><h2>Hết giờ!</h2><p>${teamLabel(t%teams.length)} được ${tscore} điểm ở lượt này.</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),600);
  }
  prep();
};

   <div class="rail"><div class="train" id="train"></div><div class="track"></div></div>
   <div class="conveyor"><div class="belt" id="belt"></div></div></div>

  const train=$('#train'),belt=$('#belt');let boxesCur=[];

    L=ls[k%ls.length];team=k%teams.length;running=false;

    train.className='train';

      `<div class="engine" style="${lsty(L)}"><span class="chimney"></span>${esc(L.letter)}<span class="wheels"><i></i><i></i><i></i></span></div>`;
    const others=shuffle(pool().filter(w=>w.lid!==L.id)).slice(0,Math.max(3,8-need4));
    const boxes=shuffle([...words.map(w=>({...w,lid:L.id})),...others]);boxesCur=boxes;
    belt.innerHTML=boxes.map((w,i)=>`<button class="box" data-i="${i}" aria-label="${esc(w.w)}"><span class="emo">${w.e}</span><span class="fw">${esc(w.w)}</span></button>`).join('');
    $$('.box',belt).forEach((b,i)=>draggable(b,{onTap:()=>load(b,boxes[i]),onDrop:(x,y)=>{if(inRect(train,x,y,40))load(b,boxes[i]);else reset(b)}}));
    $('#tinfo').innerHTML=`${teamLabel(team)} xếp hàng cho tàu <span class="lchip" style="${lsty(L)}">${esc(L.letter)} ${esc(L.sound)}</span>`;$('#tt').textContent=DUR;

  }
  function listenTrain(){beginListening(alts=>{if(!running)return;

    for(let i=0;i<boxesCur.length;i++){const b=bx[i];if(!b||b.classList.contains('gone'))continue;if(boxesCur[i].lid===L.id&&saidWord(alts,boxesCur[i].w)){load(b,boxesCur[i]);break}}});}
  const reset=b=>{b.style.position='';b.style.left='';b.style.top=''};

  }
  function done(){
    running=false;clearInterval(tid);stopRecog();const pts=Math.max(100,100+left*15-wrong*30);addScore(team,pts);
    sfx.choo();later(()=>say('Choo choo!'),400);later(()=>train.classList.add('leave'),700);
    toast(`${teams[team].name} được ${pts} điểm!`);later(next,3800);
  }

/* ============ 11. WORD MAZE ESCAPE ============ */
screens.maze=()=>{
  if(!need(2))return;const voice=voiceMode;
  const ls=activeLessons(),SZ=5;let t=0;
  shell(`🗺️ Word Maze Escape${voice?' 🎤':''}`,voice?'Mê cung bằng giọng nói':'Mê cung tìm đường',
    voice?'Dẫn thám tử 🕵️ tới kho báu 💎 bằng cách NÓI TO từ ở ô kề bên có âm mục tiêu vào micro để bước tới ô đó.':'Mỗi đội có một mê cung và một âm mục tiêu. Dẫn thám tử 🕵️ từ góc trên trái tới kho báu 💎, chỉ bước sang ô kề bên có âm mục tiêu. Bước nhầm ô khác sẽ dính bẫy và bị lùi lại. Dùng phím mũi tên hoặc chạm ô kề bên.',
  `<div class="maze-top"><span class="pill" id="mwho"></span><div class="target" id="mtarget"></div><span class="pill">Bước sai: <b id="mwrong">0</b></span></div>
   ${voice?micHTML():''}
   <div class="maze-grid" id="grid" style="grid-template-columns:repeat(${SZ},1fr)"></div>`);
  const grid=$('#grid');let target,cells,hero,wrong,running=false;
  const key=(r,c)=>r*SZ+c;
  function listenMaze(){beginListening(alts=>{if(!running)return;
    const opts=[[-1,0],[1,0],[0,-1],[0,1]];
    for(const [dr,dc] of opts){const nr=hero.r+dr,nc=hero.c+dc;if(nr<0||nc<0||nr>=SZ||nc>=SZ)continue;const cl=cells[key(nr,nc)];if(cl.safe&&saidWord(alts,cl.w.w)){move(dr,dc);break}}});}
  function build(){
    target=ls[t%ls.length];
    const tw=target.words.map(w=>({...w,lid:target.id}));
    const others=pool().filter(w=>w.lid!==target.id);
    cells=Array(SZ*SZ).fill(null);
    // guaranteed path of target cells from 0,0 to SZ-1,SZ-1
    let r=0,c=0;const path=[[0,0]];
    while(r<SZ-1||c<SZ-1){if(r===SZ-1)c++;else if(c===SZ-1)r++;else Math.random()<.5?c++:r++;path.push([r,c])}
    path.forEach(([pr,pc])=>cells[key(pr,pc)]={w:pick(tw),safe:true});
    for(let i=0;i<SZ*SZ;i++){if(cells[i])continue;
      if(Math.random()<.28)cells[i]={w:pick(tw),safe:true};
      else cells[i]={w:pick(others),safe:false};}
    cells[0]={w:cells[0].w,safe:true};hero={r:0,c:0};wrong=0;
    grid.innerHTML=cells.map((cl,i)=>{const rr=Math.floor(i/SZ),cc=i%SZ;const goal=rr===SZ-1&&cc===SZ-1;
      return `<button class="cell" data-r="${rr}" data-c="${cc}"><span class="emo">${cl.w.e}</span><span class="fw">${esc(cl.w.w)}</span>${goal?'<span class="who" style="right:2px;bottom:0">💎</span>':''}</button>`}).join('');
    $('#mtarget').innerHTML=`Chỉ đi ô âm <span class="lchip" style="${lsty(target)}">${esc(target.letter)} ${esc(target.sound)}</span>`;
    $('#mwho').innerHTML=`Lượt: ${teamLabel(t%teams.length)}`;$('#mwrong').textContent=0;
    paint();
  }
  function paint(){
    $$('.cell',grid).forEach(el=>{const r=+el.dataset.r,c=+el.dataset.c;el.classList.toggle('hero',r===hero.r&&c===hero.c);
      const adj=Math.abs(r-hero.r)+Math.abs(c-hero.c)===1;el.classList.toggle('reach',adj&&running);
      let who=el.querySelector('.hero-mark');if(r===hero.r&&c===hero.c){if(!who){who=document.createElement('span');who.className='who hero-mark';who.textContent='🕵️';el.appendChild(who)}}else if(who)who.remove();});
  }
  function move(dr,dc){
    if(!running)return;const nr=hero.r+dr,nc=hero.c+dc;if(nr<0||nc<0||nr>=SZ||nc>=SZ)return;
    const cl=cells[key(nr,nc)];
    if(cl.safe){hero={r:nr,c:nc};sfx.pop();say(cl.w.w,1.05);paint();
      $$('.cell',grid).forEach(el=>{if(+el.dataset.r===nr&&+el.dataset.c===nc)el.classList.add('visited')});
      if(nr===SZ-1&&nc===SZ-1)done();
    }else{wrong++;$('#mwrong').textContent=wrong;sfx.bad();addScore(t%teams.length,-20);
      const el=$$('.cell',grid).find(e=>+e.dataset.r===nr&&+e.dataset.c===nc);el.classList.remove('trap');void el.offsetWidth;el.classList.add('trap');
      toast(`"${cl.w.w}" không phải âm ${target.sound} — dính bẫy!`);}
  }
  function done(){
    running=false;stopRecog();const pts=Math.max(100,300-wrong*30);addScore(t%teams.length,pts);sfx.win();confetti();
    later(()=>overlay(`<div class="ov-emoji">💎</div><h2>Tới kho báu rồi!</h2><p>${teamLabel(t%teams.length)} được ${pts} điểm (sai ${wrong} bước).</p>`,[{label:t+1<teams.length*ROUNDS?'Lượt đội tiếp theo':'Xem kết quả',fn:()=>{t++;prep()}}]),500);
  }
  grid.addEventListener('pointerdown',e=>{const el=e.target.closest('.cell');if(!el||!running)return;const r=+el.dataset.r,c=+el.dataset.c;if(Math.abs(r-hero.r)+Math.abs(c-hero.c)===1)move(r-hero.r,c-hero.c)});
  onKey(e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1])}});
  if(voice)wireMic(()=>{if(running)listenMaze()});
  function prep(){if(t>=teams.length*ROUNDS){results('Mê cung hoàn thành!',()=>go('maze'));return}build();turnCard(t%teams.length,`Dẫn thám tử tới kho báu, ${voice?'NÓI TO từ ở ô kề bên':'chỉ bước qua ô'} có âm <span class="lchip" style="${lsty(ls[t%ls.length])}">${esc(ls[t%ls.length].letter)} ${esc(ls[t%ls.length].sound)}</span>.`,()=>{running=true;paint();if(voice)listenMaze()})}
  prep();
};
